en:
  site_settings:
    cyberforums_marketplace_enabled: "Enable Cyberforums marketplace (shop group mirror, vendor fields, vendor list API)"
    cyberforums_marketplace_shop_group_prefix: "Group name prefix that marks a shop group"
    cyberforums_marketplace_shop_messageable_level: "Who can message a new shop group (3 = members, moderators, admins; 99 = everyone)"
    cyberforums_marketplace_guest_api_enabled: "Enable the admin-only guest (staged user) endpoint used by product-comments"
    cyberforums_marketplace_woo_webhook_enabled: "Accept merchant sync webhooks from the WooCommerce marketplace"
    cyberforums_marketplace_woo_webhook_secret: "WooCommerce webhook secret (same value as in the marketplace webhook settings)"
    cyberforums_marketplace_woo_webhook_source: "Optional: only accept webhooks whose X-WC-Webhook-Source equals this site URL (blank = no check)"
