plugins:
  cyberforums_marketplace_enabled:
    default: false
    client: false
  cyberforums_marketplace_shop_group_prefix:
    default: "shop-"
    client: false
  cyberforums_marketplace_shop_messageable_level:
    default: "3"
    type: enum
    choices:
      - "3"
      - "99"
    client: false
  cyberforums_marketplace_guest_api_enabled:
    default: false
    client: false
  cyberforums_marketplace_woo_webhook_enabled:
    default: false
    client: false
  cyberforums_marketplace_woo_webhook_secret:
    default: ""
    secret: true
    client: false
  cyberforums_marketplace_woo_webhook_source:
    default: ""
    client: false
  cyberforums_marketplace_sla_reminders_enabled:
    default: false
    client: false
  cyberforums_marketplace_sla_reminder_hour:
    default: 9
    type: integer
    min: 0
    max: 23
    client: false
  cyberforums_marketplace_stale_enabled:
    default: false
    client: false
  cyberforums_marketplace_stale_idle_days:
    default: 14
    type: integer
    min: 1
    max: 365
    client: false
  cyberforums_marketplace_stale_hour:
    default: 4
    type: integer
    min: 0
    max: 23
    client: false
  cyberforums_marketplace_stale_tag:
    default: "闲置"
    client: false
  cyberforums_marketplace_pm_commerce_sidebar_enabled:
    default: false
    client: true
  cyberforums_marketplace_chat_api_base:
    default: "https://chat.cyberforums.com"
    client: false
  cyberforums_marketplace_chat_proxy_token:
    default: ""
    secret: true
    client: false
